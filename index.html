<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>สถิติ บทที่ 5–6 — ชุดครบครัน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --tab-bg: #0f172a;
    --tab-border: rgba(255,255,255,0.08);
    --tab-text: #94a3b8;
    --tab-active-text: #f8fafc;
    --tab-active-bg: #1e293b;
    --accent:  #6366f1;
    --accent2: #e8b84b;
    --accent3: #34d399;
    --accent4: #f472b6;

    --safe-top:    env(safe-area-inset-top,    0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left:   env(safe-area-inset-left,   0px);
    --safe-right:  env(safe-area-inset-right,  0px);
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Sarabun', sans-serif;
    background: var(--tab-bg);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ===== FRAME WRAPPER ===== */
  #frame-wrapper {
    flex: 1 1 0;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .page-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: white;
    -webkit-overflow-scrolling: touch;
  }
  .page-frame.active { display: block; }

  .frame-loading {
    position: absolute;
    inset: 0;
    background: var(--tab-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity .3s;
  }
  .frame-loading.hidden { opacity: 0; pointer-events: none; }

  .loading-inner {
    text-align: center;
    color: var(--tab-text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(255,255,255,0.08);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== NAV SHELL — mobile: bottom, desktop: top ===== */
  #nav-shell {
    flex-shrink: 0;
    background: var(--tab-bg);
    border-top: 1px solid var(--tab-border);
    display: flex;
    flex-direction: column;
  }

  /* ===== UNIT SELECTOR ===== */
  #unit-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--tab-border);
    flex-shrink: 0;
  }

  .unit-pill {
    display: flex;
    width: 100%;
    max-width: 300px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--tab-border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .unit-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--tab-text);
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .02em;
    border-radius: 7px;
    transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .unit-btn[data-unit="5"].active {
    background: var(--accent2);
    color: #0f172a;
    box-shadow: 0 1px 6px rgba(0,0,0,.35);
  }
  .unit-btn[data-unit="6"].active {
    background: var(--accent4);
    color: #0f172a;
    box-shadow: 0 1px 6px rgba(0,0,0,.35);
  }

  /* ===== SUB-TAB BAR ===== */
  #tab-bar {
    display: flex;
    align-items: stretch;
    height: 58px;
    padding-bottom: max(var(--safe-bottom), 4px);
  }

  .tab-group {
    display: flex;
    flex: 1;
    align-items: stretch;
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 4px 2px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--tab-text);
    font-family: 'Sarabun', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .01em;
    border-top: 2px solid transparent;
    transition: all .18s ease;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    min-height: 44px;
  }
  .tab-btn:active { background: rgba(255,255,255,0.04); }
  .tab-btn.active { color: var(--tab-active-text); background: var(--tab-active-bg); }

  .tab-icon { font-size: 20px; line-height: 1; transition: transform .18s ease; }
  .tab-btn.active .tab-icon { transform: translateY(-1px) scale(1.1); }

  .tab-label {
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    padding: 0 2px;
  }

  /* Mobile accent colours */
  #tabs-5 .tab-btn[data-tab="lecture5"].active  { border-top-color: var(--accent2); color: var(--accent2); }
  #tabs-5 .tab-btn[data-tab="answers5"].active  { border-top-color: var(--accent);  color: #a5b4fc; }
  #tabs-5 .tab-btn[data-tab="tutorial5"].active { border-top-color: var(--accent3); color: var(--accent3); }
  #tabs-6 .tab-btn[data-tab="lecture6"].active  { border-top-color: var(--accent4); color: var(--accent4); }
  #tabs-6 .tab-btn[data-tab="answers6"].active  { border-top-color: var(--accent);  color: #a5b4fc; }

  /* Desktop dot indicators (hidden on mobile) */
  .tab-dot {
    display: none;
    width: 7px; height: 7px;
    border-radius: 50%;
    opacity: 0.5;
  }

  /* ===== DESKTOP ≥ 640px ===== */
  @media (min-width: 640px) {
    #nav-shell {
      order: -1;
      border-top: none;
      border-bottom: 1px solid var(--tab-border);
      flex-direction: row;
      align-items: stretch;
      height: 52px;
    }

    /* Brand label */
    #nav-shell::before {
      content: 'CH.5–6 · STATS';
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent2);
      letter-spacing: .12em;
      white-space: nowrap;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-right: 1px solid var(--tab-border);
      flex-shrink: 0;
    }

    #unit-bar {
      border-bottom: none;
      border-right: 1px solid var(--tab-border);
      height: 100%;
      flex-shrink: 0;
      padding: 7px 12px;
    }

    .unit-pill {
      max-width: none;
      width: auto;
      height: 100%;
    }

    .unit-btn {
      padding: 0 14px;
      height: auto;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      border-radius: 6px;
    }

    #tab-bar {
      height: 100%;
      padding-bottom: 0;
      flex: 1;
      padding-left: 8px;
    }

    .tab-btn {
      flex: 0 0 auto;
      flex-direction: row;
      height: 100%;
      padding: 0 20px;
      gap: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: .04em;
      border-top: none;
      border-bottom: 2px solid transparent;
      font-weight: 400;
    }
    .tab-btn.active { border-top: none; border-bottom-color: var(--accent); }

    /* Desktop accent colours */
    #tabs-5 .tab-btn[data-tab="lecture5"].active  { border-bottom-color: var(--accent2); color: var(--tab-active-text); }
    #tabs-5 .tab-btn[data-tab="answers5"].active  { border-bottom-color: var(--accent);  color: var(--tab-active-text); }
    #tabs-5 .tab-btn[data-tab="tutorial5"].active { border-bottom-color: var(--accent3); color: var(--tab-active-text); }
    #tabs-6 .tab-btn[data-tab="lecture6"].active  { border-bottom-color: var(--accent4); color: var(--tab-active-text); }
    #tabs-6 .tab-btn[data-tab="answers6"].active  { border-bottom-color: var(--accent);  color: var(--tab-active-text); }

    .tab-icon { font-size: 14px; }
    .tab-label { font-size: 12px; max-width: none; }
    .tab-btn.active .tab-icon { transform: none; }

    .tab-dot { display: inline-block; }
    .tab-btn.active .tab-dot { opacity: 1; }
    #tabs-5 .tab-btn[data-tab="lecture5"]  .tab-dot { background: var(--accent2); }
    #tabs-5 .tab-btn[data-tab="answers5"]  .tab-dot { background: var(--accent); }
    #tabs-5 .tab-btn[data-tab="tutorial5"] .tab-dot { background: var(--accent3); }
    #tabs-6 .tab-btn[data-tab="lecture6"]  .tab-dot { background: var(--accent4); }
    #tabs-6 .tab-btn[data-tab="answers6"]  .tab-dot { background: var(--accent); }
  }
</style>
</head>
<body>

<div id="app">

  <!-- Content area -->
  <div id="frame-wrapper">

    <!-- Loading overlays -->
    <div class="frame-loading"        id="loading-lecture5">
      <div class="loading-inner"><div class="spinner"></div>กำลังโหลด Lecture Notes บทที่ 5…</div>
    </div>
    <div class="frame-loading hidden" id="loading-answers5">
      <div class="loading-inner"><div class="spinner"></div>กำลังโหลดเฉลย บทที่ 5…</div>
    </div>
    <div class="frame-loading hidden" id="loading-tutorial5">
      <div class="loading-inner"><div class="spinner"></div>กำลังโหลด Tutorial…</div>
    </div>
    <div class="frame-loading hidden" id="loading-lecture6">
      <div class="loading-inner"><div class="spinner"></div>กำลังโหลด Lecture Notes บทที่ 6…</div>
    </div>
    <div class="frame-loading hidden" id="loading-answers6">
      <div class="loading-inner"><div class="spinner"></div>กำลังโหลดเฉลย บทที่ 6…</div>
    </div>

    <!-- Iframes -->
    <iframe class="page-frame active" id="frame-lecture5"
            src="unit_5_claude.html"
            onload="frameLoaded('lecture5')"></iframe>

    <iframe class="page-frame" id="frame-answers5"
            data-src="Answer Chapter 5.html"
            onload="frameLoaded('answers5')"></iframe>

    <iframe class="page-frame" id="frame-tutorial5"
            data-src="tutorial_STD5.html"
            onload="frameLoaded('tutorial5')"></iframe>

    <iframe class="page-frame" id="frame-lecture6"
            data-src="unit_6_claude.html"
            onload="frameLoaded('lecture6')"></iframe>

    <iframe class="page-frame" id="frame-answers6"
            data-src="Answer Chapter 6.html"
            onload="frameLoaded('answers6')"></iframe>

  </div>

  <!-- Navigation shell (bottom on mobile, top on desktop) -->
  <div id="nav-shell">

    <!-- Unit selector -->
    <div id="unit-bar">
      <div class="unit-pill">
        <button class="unit-btn active" data-unit="5" onclick="switchUnit(5)">📘 Unit 5</button>
        <button class="unit-btn"        data-unit="6" onclick="switchUnit(6)">📗 Unit 6</button>
      </div>
    </div>

    <!-- Sub-tabs -->
    <nav id="tab-bar" role="tablist">

      <div id="tabs-5" class="tab-group">
        <button class="tab-btn active" data-tab="lecture5" onclick="switchTab('lecture5')"
                role="tab" aria-selected="true" aria-controls="frame-lecture5">
          <span class="tab-icon">📖</span>
          <span class="tab-dot" aria-hidden="true"></span>
          <span class="tab-label">Lecture Notes</span>
        </button>
        <button class="tab-btn" data-tab="answers5" onclick="switchTab('answers5')"
                role="tab" aria-selected="false" aria-controls="frame-answers5">
          <span class="tab-icon">✅</span>
          <span class="tab-dot" aria-hidden="true"></span>
          <span class="tab-label">เฉลยแบบฝึกหัด</span>
        </button>
        <button class="tab-btn" data-tab="tutorial5" onclick="switchTab('tutorial5')"
                role="tab" aria-selected="false" aria-controls="frame-tutorial5">
          <span class="tab-icon">🎓</span>
          <span class="tab-dot" aria-hidden="true"></span>
          <span class="tab-label">Interactive Tutorial</span>
        </button>
      </div>

      <div id="tabs-6" class="tab-group" style="display:none">
        <button class="tab-btn active" data-tab="lecture6" onclick="switchTab('lecture6')"
                role="tab" aria-selected="true" aria-controls="frame-lecture6">
          <span class="tab-icon">📖</span>
          <span class="tab-dot" aria-hidden="true"></span>
          <span class="tab-label">Lecture Notes</span>
        </button>
        <button class="tab-btn" data-tab="answers6" onclick="switchTab('answers6')"
                role="tab" aria-selected="false" aria-controls="frame-answers6">
          <span class="tab-icon">✅</span>
          <span class="tab-dot" aria-hidden="true"></span>
          <span class="tab-label">เฉลยแบบฝึกหัด</span>
        </button>
      </div>

    </nav>
  </div>
</div>

<script>
  const loaded = {};
  const activeTab = { 5: 'lecture5', 6: 'lecture6' };
  let currentUnit = 5;

  function frameLoaded(name) {
    loaded[name] = true;
    const overlay = document.getElementById('loading-' + name);
    if (overlay) overlay.classList.add('hidden');
  }

  function switchUnit(unit) {
    currentUnit = unit;

    document.querySelectorAll('.unit-btn').forEach(b => {
      b.classList.toggle('active', +b.dataset.unit === unit);
    });

    document.getElementById('tabs-5').style.display = unit === 5 ? '' : 'none';
    document.getElementById('tabs-6').style.display = unit === 6 ? '' : 'none';

    switchTab(activeTab[unit]);
  }

  function switchTab(name) {
    const unit = name.endsWith('5') ? 5 : 6;
    activeTab[unit] = name;

    const group = document.getElementById('tabs-' + unit);
    group.querySelectorAll('.tab-btn').forEach(b => {
      const on = b.dataset.tab === name;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
    const frame = document.getElementById('frame-' + name);
    frame.classList.add('active');

    const overlay = document.getElementById('loading-' + name);
    if (overlay && !loaded[name]) overlay.classList.remove('hidden');

    if (!frame.src || frame.src === 'about:blank' || !frame.src.includes('.html')) {
      const lazySrc = frame.getAttribute('data-src');
      if (lazySrc) frame.src = lazySrc;
    }
  }
</script>

</body>
</html>
